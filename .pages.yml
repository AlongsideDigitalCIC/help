media:
  input: docs/media
  output: media

content:
  - name: presenter
    label: Presenter Guides
    type: collection
    path: docs/presenter
    filename: "{primary}.md"
    exclude:
      - _sidebar.md
    view:
      fields: [title, description]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short Description
        type: string
      - name: body
        label: Guide Content
        type: rich-text

  - name: admin-centre
    label: Admin Centre Guides
    type: collection
    path: docs/admin-centre
    filename: "{primary}.md"
    exclude:
      - _sidebar.md
    view:
      fields: [title, description]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short Description
        type: string
      - name: body
        label: Guide Content
        type: rich-text

  - name: home
    label: Help Centre Homepage
    type: file
    path: docs/README.md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: body
        label: Content
        type: rich-text

  - name: support
    label: Contact & Support Page
    type: file
    path: docs/support.md
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: body
        label: Content
        type: rich-text

  - name: presenter-sidebar
    label: Presenter Sidebar Menu
    type: file
    path: docs/presenter/_sidebar.md
    fields:
      - name: body
        label: Presenter Sidebar Links (Markdown)
        type: code
        options:
          language: markdown

  - name: admin-centre-sidebar
    label: Admin Centre Sidebar Menu
    type: file
    path: docs/admin-centre/_sidebar.md
    fields:
      - name: body
        label: Admin Centre Sidebar Links (Markdown)
        type: code
        options:
          language: markdown

  - name: home-sidebar
    label: Main Home Sidebar Menu
    type: file
    path: docs/_sidebar.md
    fields:
      - name: body
        label: Home Sidebar Links (Markdown)
        type: code
        options:
          language: markdown
