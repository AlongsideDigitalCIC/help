<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alongside Digital Help Centre</title>
  <meta name="description" content="Find step-by-step guides, tutorials, and troubleshooting tips for Presenter and Admin Centre by Alongside Digital.">
  <link rel="icon" type="image/png" href="public/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      /* Official Alongside Digital Brand Palette */
      --background: #FAF6F0;
      --bg-alt: #F0EBE1;
      --foreground: #1C355E;
      --primary: #7A502A;          /* Collaboration Copper */
      --primary-hover: #653F1E;
      --secondary: #3D7B8C;        /* Sea Glass Teal */
      --secondary-hover: #2E606D;
      --card: #FFFFFF;
      --border: #E2D9C8;
      --text-main: #1C355E;
      --text-muted: rgba(28, 53, 94, 0.72);
      --theme-color: #7A502A;
      --header-height: 60px;       /* Mobile-first compact header; 68px on desktop */
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(122, 80, 42, 0.14);
    }

    html, body {
      background-color: var(--background) !important;
      color: var(--text-main) !important;
      font-family: var(--font-main) !important;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow-x: clip;
      margin: 0;
      padding: 0;
    }

    body.ad-sidebar-open {
      overflow: hidden !important;
    }

    /* ========================================================
       MOBILE-FIRST STICKY TOP HEADER (LOGO + NAV + SEARCH)
       ======================================================== */
    .ad-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(var(--header-height) + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
      background: rgba(250, 246, 240, 0.97);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .ad-topbar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
      flex-shrink: 0;
      min-width: 0;
    }

    .ad-logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .ad-logo-link img {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Hide Docsify's built-in .app-nav so it never collides with our sticky header */
    .app-nav {
      display: none !important;
    }

    /* Product Switcher Tabs in Top Header (Desktop >= 960px; mobile uses drawer pills) */
    .ad-product-nav {
      display: none;
      align-items: center;
      gap: 0.35rem;
      padding-left: 1rem;
      border-left: 1px solid var(--border);
      position: static;
      margin: 0;
    }

    .ad-product-link {
      display: inline-flex;
      align-items: center;
      padding: 0.42rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--foreground) !important;
      text-decoration: none !important;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ad-product-link:hover {
      background: rgba(122, 80, 42, 0.08);
      color: var(--primary) !important;
    }

    .ad-product-link.active {
      background: var(--primary);
      color: #FFFFFF !important;
      box-shadow: 0 3px 10px rgba(122, 80, 42, 0.22);
    }

    /* Mobile-first 44x44 touch target Menu Button */
    .ad-mobile-menu-btn {
      display: inline-flex;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--foreground);
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .ad-mobile-menu-btn:active {
      background: var(--bg-alt);
      border-color: var(--primary);
    }

    .ad-mobile-menu-btn .ad-icon-close {
      display: none;
    }

    body.ad-sidebar-open .ad-mobile-menu-btn .ad-icon-menu {
      display: none;
    }

    body.ad-sidebar-open .ad-mobile-menu-btn .ad-icon-close {
      display: block;
    }

    /* Search Bar (Mobile-first: 16px prevents iOS Safari zoom) */
    .ad-search-center {
      flex: 1;
      min-width: 0;
      max-width: none;
      margin-left: auto;
      z-index: 10;
    }

    .ad-search-box {
      position: relative;
      width: 100%;
    }

    .ad-search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .ad-search-input {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.45rem 0.85rem 0.45rem 2.3rem;
      font-family: var(--font-main);
      font-size: 16px;
      color: var(--foreground);
      box-shadow: 0 2px 8px rgba(28, 53, 94, 0.04);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .ad-search-input::placeholder {
      color: rgba(28, 53, 94, 0.52);
    }

    .ad-search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(122, 80, 42, 0.14);
    }

    .ad-search-kbd {
      display: none;
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.12rem 0.42rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Search Dropdown Results (Mobile-first: full viewport width below topbar) */
    .ad-search-results {
      position: fixed;
      top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 6px);
      left: 0.75rem;
      right: 0.75rem;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(28, 53, 94, 0.18);
      max-height: 68vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display: none;
      padding: 0.5rem;
      z-index: 300;
    }

    .ad-search-results.open {
      display: block;
    }

    .ad-search-item {
      display: block;
      padding: 0.8rem 0.9rem;
      border-radius: 10px;
      text-decoration: none !important;
      color: var(--foreground) !important;
      transition: background 0.15s ease;
    }

    .ad-search-item:hover,
    .ad-search-item:active {
      background: var(--background);
    }

    .ad-search-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .ad-search-item-title {
      font-weight: 700;
      font-size: 0.94rem;
      color: var(--foreground);
    }

    .ad-search-item-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.14rem 0.5rem;
      border-radius: 9999px;
      background: var(--bg-alt);
      color: var(--primary);
      flex-shrink: 0;
    }

    .ad-search-item-snippet {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin: 0;
    }

    .ad-search-item-snippet mark {
      background: rgba(122, 80, 42, 0.16);
      color: var(--primary);
      font-weight: 600;
      border-radius: 3px;
      padding: 0 2px;
    }

    .ad-search-empty {
      padding: 1.25rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Dimmed tap-to-close backdrop behind mobile sidebar drawer */
    .ad-sidebar-backdrop {
      position: fixed;
      inset: 0;
      top: calc(var(--header-height) + env(safe-area-inset-top, 0px));
      background: rgba(28, 53, 94, 0.38);
      z-index: 185;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    body.ad-sidebar-open .ad-sidebar-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    /* Mobile-only product switcher injected at top of sidebar drawer */
    .ad-mobile-product-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem;
      margin-bottom: 1rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .ad-mobile-product-bar a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      text-align: center;
      padding: 0.5rem 0.5rem;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none !important;
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--foreground) !important;
    }

    .ad-mobile-product-bar a.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF !important;
    }

    /* ========================================================
       MOBILE-FIRST SIDEBAR DRAWER (OFF-CANVAS < 960px, DOCKED >= 960px)
       ======================================================== */
    .sidebar,
    body.close .sidebar {
      position: fixed !important;
      top: calc(var(--header-height) + env(safe-area-inset-top, 0px)) !important;
      left: 0 !important;
      bottom: 0 !important;
      background-color: var(--background) !important;
      border-right: 1px solid var(--border) !important;
      padding: 1rem 0.85rem calc(3.5rem + env(safe-area-inset-bottom, 0px)) !important;
      width: min(310px, 86vw) !important;
      font-family: var(--font-main) !important;
      transform: translateX(-100%) !important;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1) !important;
      z-index: 195 !important;
      box-shadow: 10px 0 32px rgba(28, 53, 94, 0.16);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    body.ad-sidebar-open .sidebar,
    body.ad-sidebar-open.close .sidebar {
      transform: translateX(0) !important;
    }

    .sidebar > h1.app-name,
    .sidebar-toggle {
      display: none !important;
    }

    .sidebar-nav {
      padding-bottom: 2rem;
    }

    .sidebar-nav ul {
      margin: 0 !important;
      padding: 0 !important;
      list-style: none !important;
    }

    /* Collapsible Top-Level Product Groups (Presenter, Admin Centre) */
    .sidebar-nav > ul > li {
      margin-bottom: 0.75rem !important;
    }

    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      min-height: 44px;
      color: var(--foreground) !important;
      font-size: 0.85rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
      text-transform: uppercase !important;
      padding: 0.55rem 0.85rem !important;
      margin: 0.2rem 0 0.25rem !important;
      border-radius: 10px;
      background: rgba(240, 235, 225, 0.7);
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .sidebar-nav > ul > li > p:hover,
    .sidebar-nav > ul > li > strong:hover {
      background: var(--bg-alt);
      color: var(--primary) !important;
      border-color: rgba(122, 80, 42, 0.3);
    }

    .sidebar-nav > ul > li > p::after,
    .sidebar-nav > ul > li > strong::after {
      content: '▾';
      font-size: 0.9rem;
      color: var(--primary);
      transition: transform 0.2s ease;
    }

    /* Level 2 Collapsible Sub-Groups (Installation, Getting Started, etc.) */
    .sidebar-nav li.ad-sub-group {
      margin: 0.35rem 0 0.25rem 0.25rem !important;
    }

    .sidebar-nav li.ad-sub-group > p,
    .sidebar-nav li.ad-sub-group > strong {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      min-height: 40px;
      color: #8C7360 !important;
      font-size: 0.72rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      padding: 0.45rem 0.7rem !important;
      margin: 0.15rem 0 !important;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .sidebar-nav li.ad-sub-group > p:hover,
    .sidebar-nav li.ad-sub-group > strong:hover {
      background: rgba(122, 80, 42, 0.06);
      color: var(--primary) !important;
    }

    .sidebar-nav li.ad-sub-group > p::after,
    .sidebar-nav li.ad-sub-group > strong::after {
      content: '▾';
      font-size: 0.8rem;
      opacity: 0.75;
      transition: transform 0.2s ease;
    }

    .sidebar-nav li.ad-sub-group > ul {
      padding-left: 0.55rem !important;
      border-left: 1px solid var(--border);
      margin-left: 0.65rem !important;
      margin-top: 0.15rem !important;
      margin-bottom: 0.35rem !important;
    }

    /* Collapsed State (works for both Level 1 and Level 2) */
    .sidebar-nav li.ad-collapsed > p::after,
    .sidebar-nav li.ad-collapsed > strong::after {
      transform: rotate(-90deg);
    }

    .sidebar-nav li.ad-collapsed > ul {
      display: none !important;
    }

    /* Sidebar Links (Mobile-first 42px comfortable touch targets) */
    .sidebar-nav ul li a {
      display: block !important;
      color: var(--foreground) !important;
      font-size: 0.92rem !important;
      font-weight: 500 !important;
      line-height: 1.4 !important;
      border-radius: 8px !important;
      padding: 0.58rem 0.8rem !important;
      margin: 0.14rem 0 !important;
      border-right: none !important;
      text-decoration: none !important;
      transition: all 0.15s ease !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-nav ul li a:hover {
      background-color: rgba(122, 80, 42, 0.08) !important;
      color: var(--primary) !important;
      text-decoration: none !important;
    }

    /* Active Page Pill - Solid Collaboration Copper (#7A502A) at any nesting level */
    .sidebar-nav li.active:not(.ad-toc-item) > a {
      background-color: var(--primary) !important;
      color: #FFFFFF !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 12px rgba(122, 80, 42, 0.2) !important;
    }

    /* Nested child pages under a sidebar guide (e.g. Migrating a Song Database under Songs) */
    .sidebar-nav li.ad-sub-group > ul > li > ul:not(.app-sub-sidebar) {
      margin-top: 0.15rem !important;
      margin-bottom: 0.35rem !important;
      padding-left: 0.65rem !important;
      border-left: 2px solid var(--border) !important;
      margin-left: 0.75rem !important;
    }

    .sidebar-nav li.ad-sub-group > ul > li > ul:not(.app-sub-sidebar) > li > a {
      font-size: 0.86rem !important;
      padding: 0.48rem 0.7rem !important;
      color: var(--text-muted) !important;
    }

    .sidebar-nav li.ad-sub-group > ul > li > ul:not(.app-sub-sidebar) > li.active:not(.ad-toc-item) > a {
      color: #FFFFFF !important;
    }

    /* Sub-headings table of contents inside sidebar */
    .sidebar-nav ul.app-sub-sidebar {
      margin-top: 0.2rem !important;
      margin-bottom: 0.45rem !important;
      padding-left: 0.75rem !important;
      border-left: 2px solid var(--border) !important;
      margin-left: 0.75rem !important;
    }

    .sidebar-nav ul.app-sub-sidebar li::before {
      display: none !important;
      content: none !important;
    }

    .sidebar-nav ul.app-sub-sidebar li a {
      font-size: 0.84rem !important;
      padding: 0.42rem 0.6rem !important;
      color: var(--text-muted) !important;
      background: transparent !important;
      box-shadow: none !important;
      font-weight: 500 !important;
    }

    .sidebar-nav ul.app-sub-sidebar li a::before {
      content: none !important;
    }

    .sidebar-nav ul.app-sub-sidebar li.active > a,
    .sidebar-nav ul.app-sub-sidebar li a:hover {
      color: var(--primary) !important;
      font-weight: 600 !important;
      background: rgba(122, 80, 42, 0.06) !important;
      box-shadow: none !important;
    }

    /* Sidebar Contact Support Footer */
    .ad-sidebar-support {
      margin-top: 1.5rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--border);
    }

    .ad-sidebar-support-btn {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      text-decoration: none !important;
      color: var(--foreground) !important;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(28, 53, 94, 0.04);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .ad-sidebar-support-btn:hover {
      border-color: var(--primary);
      color: var(--primary) !important;
      box-shadow: 0 6px 16px rgba(122, 80, 42, 0.12);
    }

    .ad-sidebar-support-email {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--secondary);
      word-break: break-all;
    }

    /* ========================================================
       MOBILE-FIRST MAIN CONTENT AREA & TYPOGRAPHY
       ======================================================== */
    /* Neutralise Docsify's mobile "body.close" slide-over so tapping a link never shifts the article.
       z-index: auto removes Docsify's main stacking context so the sidebar drawer can sit ABOVE the backdrop. */
    main {
      width: 100% !important;
      z-index: auto !important;
    }

    .content,
    body.close .content {
      position: static !important;
      top: auto !important;
      left: 0 !important;
      transform: none !important;
      padding-top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 0.5rem) !important;
      max-width: 100%;
      overflow-x: clip;
    }

    .markdown-section {
      max-width: 920px !important;
      padding: 1.25rem 1rem calc(4rem + env(safe-area-inset-bottom, 0px)) !important;
      color: var(--text-main) !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--foreground) !important;
      font-family: var(--font-main) !important;
      font-weight: 700 !important;
      line-height: 1.25 !important;
      scroll-margin-top: calc(var(--header-height) + env(safe-area-inset-top, 0px) + 18px);
    }

    .markdown-section h1 {
      font-size: clamp(1.75rem, 6vw, 2.65rem) !important;
      letter-spacing: -0.4px;
      margin-top: 0 !important;
      margin-bottom: 0.5rem !important;
    }

    .ad-page-lead {
      font-size: 1.02rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      margin-bottom: 1.65rem;
      line-height: 1.58;
    }

    .markdown-section h2 {
      font-size: clamp(1.3rem, 4.2vw, 1.55rem) !important;
      margin-top: 2rem !important;
      margin-bottom: 0.85rem !important;
      padding-bottom: 0.35rem;
      border-bottom: none !important;
    }

    .markdown-section h3 {
      font-size: 1.12rem !important;
      margin-top: 1.4rem !important;
      margin-bottom: 0.55rem !important;
    }

    .markdown-section p,
    .markdown-section ul,
    .markdown-section ol {
      color: var(--text-main) !important;
      font-size: 0.98rem !important;
      line-height: 1.68 !important;
      overflow-wrap: anywhere;
    }

    .markdown-section ul,
    .markdown-section ol {
      padding-left: 1.35rem;
    }

    .markdown-section a.anchor {
      color: var(--foreground) !important;
      text-decoration: none !important;
    }

    .markdown-section a.anchor span {
      color: var(--foreground) !important;
    }

    .markdown-section a:not(.ad-btn):not(.anchor) {
      color: var(--secondary) !important;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .markdown-section a:not(.ad-btn):not(.anchor):hover {
      color: var(--primary) !important;
    }

    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border) !important;
      margin: 1.85rem 0 !important;
    }

    .markdown-section code {
      background-color: #EDE6DC !important;
      color: var(--foreground) !important;
      border-radius: 6px !important;
      padding: 0.16rem 0.4rem !important;
      font-size: 0.86em !important;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-section pre {
      background-color: #FFFFFF !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      padding: 1rem !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }

    .markdown-section pre code {
      word-break: normal;
      overflow-wrap: normal;
    }

    /* Step Screenshots & Guide Images */
    .markdown-section img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: 12px !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 8px 24px rgba(28, 53, 94, 0.08) !important;
      margin: 0.85rem 0 1.5rem !important;

    /* ========================================================

    /* ========================================================

    @media (hover: hover) {

      .sidebar,
      body.close .sidebar {

  </style>

<body>
  <!-- Fixed Alongside Digital Top Navbar -->
  <header class="ad-topbar">
    <div class="ad-topbar-left">
      <button type="button" class="ad-mobile-menu-btn" id="adMobileToggle" aria-label="Toggle Menu" aria-expanded="false">
        <svg class="ad-icon-menu" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <svg class="ad-icon-close" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <a href="#/" class="ad-logo-link" aria-label="Alongside Digital Help Centre Home">
        <img src="public/logo.webp" onerror="this.src='docs/media/logo.webp'" alt="Alongside Digital">
      </a>

      <!-- Clean Top Product Switcher (Uses div + role="navigation" so Docsify never hijacks <nav> as .app-nav) -->
      <div class="ad-product-nav" id="adProductNav" role="navigation" aria-label="Product Documentation">
        <a href="#/presenter/" class="ad-product-link" data-nav="presenter">Presenter</a>
        <a href="#/admin-centre/overview" class="ad-product-link" data-nav="admin-centre">Admin Centre</a>
        <a href="mailto:help@alongsidedigital.co.uk" class="ad-product-link" title="Email help@alongsidedigital.co.uk">Contact Support</a>
      </div>
    </div>

    <!-- Instant Search -->
    <div class="ad-search-center">
      <div class="ad-search-box" id="adSearchBox">
        <span class="ad-search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input
          type="search"
          id="adSearchInput"
          class="ad-search-input"
          placeholder="Search guides..."
          autocomplete="off"
          aria-label="Search documentation"
        >
        <span class="ad-search-kbd">Ctrl K</span>
        <div class="ad-search-results" id="adSearchResults"></div>
      </div>
    </div>
  </header>

  <!-- Tap-to-close dimmed backdrop for mobile sidebar drawer -->
  <div class="ad-sidebar-backdrop" id="adSidebarBackdrop" aria-hidden="true"></div>

  <div id="app">Loading Alongside Digital Help Centre...</div>

  <script>
    // Handle direct non-hash links (e.g. /presenter/ccli-songs or /presenter/importing-songs/ from Presenter app)
    (function () {
      const pathMatch = window.location.pathname.match(/^(.*?)(\/(?:presenter|admin-centre)(?:\/[a-z0-9-]+)?|\/support)\/?$/i);
      if (pathMatch && !window.location.hash) {
        const basePrefix = pathMatch[1] || '/';
        const targetRoute = pathMatch[2].replace(/\/+$/, '');
        window.location.replace(basePrefix.replace(/\/+$/, '') + '/#' + targetRoute);
        return;
      }
    })();

    // Dynamically resolve basePath so Docsify works on localhost, help.alongsidedigital.co.uk, and GitHub Pages (/help/)
    const rootDir = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
    const docsBasePath = (rootDir ? rootDir : '') + '/docs/';

    function getActiveProduct(routePath) {
      const p = (routePath || '').toLowerCase();
      if (p.startsWith('/presenter')) return 'presenter';
      if (p.startsWith('/admin-centre')) return 'admin-centre';
      if (p.startsWith('/support')) return 'support';
      return 'home';
    }

    function updateProductNavHighlight(routePath) {
      const active = getActiveProduct(routePath);
      document.querySelectorAll('[data-nav]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-nav') === active);
      });
    }

    function enhanceSidebar(routePath) {
      const sidebar = document.querySelector('.sidebar');
      const sidebarNav = document.querySelector('.sidebar-nav');
      if (!sidebar || !sidebarNav) return;

      // 1. Inject mobile product switcher at top of drawer if not present
      let mobileBar = sidebar.querySelector('.ad-mobile-product-bar');
      if (!mobileBar) {
        mobileBar = document.createElement('div');
        mobileBar.className = 'ad-mobile-product-bar';
        mobileBar.innerHTML =
          '<a href="#/presenter/" data-nav="presenter">Presenter</a>' +
          '<a href="#/admin-centre/overview" data-nav="admin-centre">Admin Centre</a>';
        sidebar.insertBefore(mobileBar, sidebar.firstChild);
      }
      updateProductNavHighlight(routePath);

      // 2. Mark TOC items so they don't get main Copper pill styling
      sidebarNav.querySelectorAll('ul.app-sub-sidebar li').forEach(function (tocLi) {
        tocLi.classList.add('ad-toc-item');
      });

      // 3. Make both Level 1 (Products) and Level 2 (Presenter Sections) collapsible
      const activeProduct = getActiveProduct(routePath);
      const topGroups = sidebarNav.querySelectorAll(':scope > ul > li');

      topGroups.forEach(function (topLi, topIdx) {
        const topHeading = topLi.querySelector(':scope > p, :scope > strong');
        const topSubList = topLi.querySelector(':scope > ul');
        if (!topHeading || !topSubList) return;

        const headingText = (topHeading.textContent || '').trim().toLowerCase();
        const isPresenterGroup = headingText.includes('presenter');
        const isAdminGroup = headingText.includes('admin');

        if (!topHeading.dataset.collapsibleBound) {
          topHeading.dataset.collapsibleBound = 'true';
          topHeading.addEventListener('click', function () {
            const wasCollapsed = topLi.classList.contains('ad-collapsed');
            topLi.classList.toggle('ad-collapsed');
            // When opening a product from another section/home, navigate directly to its hub
            if (wasCollapsed) {
              if (isPresenterGroup && getActiveProduct(window.location.hash.replace(/^#/, '')) !== 'presenter') {
                window.location.hash = '#/presenter/';
              } else if (isAdminGroup && getActiveProduct(window.location.hash.replace(/^#/, '')) !== 'admin-centre') {
                window.location.hash = '#/admin-centre/overview';
              }
            }
          });
        }

        // Normalize current route for reliable link matching (independent of Docsify timing)
        const normalizedRoute = (routePath || '/').replace(/\/+$/, '').toLowerCase() || '/';
        function groupMatchesRoute(containerEl) {
          if (containerEl.querySelector('li.active')) return true;
          const links = containerEl.querySelectorAll('a[href]');
          for (let i = 0; i < links.length; i++) {
            const href = (links[i].getAttribute('href') || '').replace(/^#/, '').replace(/\/+$/, '').toLowerCase() || '/';
            if (href === normalizedRoute) return true;
          }
          return false;
        }

        // Handle Level 2 sub-groups inside this product (e.g. Installation, Getting Started, etc.)
        const subGroups = topSubList.querySelectorAll(':scope > li');
        subGroups.forEach(function (subLi) {
          const subHeading = subLi.querySelector(':scope > p, :scope > strong');
          const nestedUl = subLi.querySelector(':scope > ul');
          if (!subHeading || !nestedUl || nestedUl.classList.contains('app-sub-sidebar')) return;

          subLi.classList.add('ad-sub-group');
          if (!subHeading.dataset.collapsibleBound) {
            subHeading.dataset.collapsibleBound = 'true';
            subHeading.addEventListener('click', function () {
              subLi.classList.toggle('ad-collapsed');
            });
          }

          // Auto-expand only the sub-group containing the active page; keep all 7 sub-groups collapsed on Presenter overview
          const subHasActive = groupMatchesRoute(subLi);
          if (subHasActive) {
            subLi.classList.remove('ad-collapsed');
          } else {
            subLi.classList.add('ad-collapsed');
          }
        });

        // Auto-expand active product group reliably by routePath; keep other product collapsed
        const isCurrentProduct =
          (isPresenterGroup && activeProduct === 'presenter') ||
          (isAdminGroup && activeProduct === 'admin-centre');
        if (isCurrentProduct) {
          topLi.classList.remove('ad-collapsed');
        } else {
          topLi.classList.add('ad-collapsed');
        }
      });

      // 4. Add clean Contact Support button with help@alongsidedigital.co.uk below the product menus
      if (!sidebar.querySelector('.ad-sidebar-support')) {
        const supportBox = document.createElement('div');
        supportBox.className = 'ad-sidebar-support';
        supportBox.innerHTML =
          '<a href="mailto:help@alongsidedigital.co.uk" class="ad-sidebar-support-btn">' +
          '  <span>Contact Support</span>' +
          '  <span class="ad-sidebar-support-email">help@alongsidedigital.co.uk</span>' +
          '</a>';
        sidebar.appendChild(supportBox);
      }
    }

    window.$docsify = {
      name: 'Alongside Digital Help Centre',
      repo: '',
      loadSidebar: '_sidebar.md?v=10',
      alias: {
        '/.*/_sidebar.md.*': '/_sidebar.md?v=10'
      },
      requestHeaders: {
        'cache-control': 'no-cache'
      },
      subMaxLevel: 2,
      auto2top: true,
      basePath: docsBasePath,
      homepage: 'README.md',
      pagination: {
        previousText: 'Previous Guide',
        nextText: 'Next Guide',
        crossChapter: true,
        crossChapterText: true
      },
      plugins: [
        function alongsideDocsifyPlugin(hook, vm) {
          hook.beforeEach(function (rawMarkdown) {
            let content = rawMarkdown || '';
            let meta = {};

            // 1. Parse and strip YAML Frontmatter (from Pages CMS / Markdown files)
            content = content.replace(/^\uFEFF/, '');
            const fmMatch = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
            if (fmMatch) {
              content = content.slice(fmMatch[0].length);
              fmMatch[1].split(/\r?\n/).forEach(function (line) {
                const idx = line.indexOf(':');
                if (idx > -1) {
                  const key = line.slice(0, idx).trim().toLowerCase();
                  const val = line.slice(idx + 1).trim().replace(/^['"]|['"]$/g, '');
                  meta[key] = val;
                }
              });
            }

            // 2. Update Browser Title
            if (meta.title) {
              document.title = meta.title + ' | Alongside Digital Help Centre';
            } else {
              document.title = 'Alongside Digital Help Centre';
            }

            // 3. Inject Article Title & Description Header (except on Home README which renders .ad-hero)
            const isHome = !vm.route.path || vm.route.path === '/' || vm.route.path === '/README';
            const hasH1 = /^\s*#\s+/.test(content) || content.indexOf('class="ad-hero"') !== -1;
            if (!isHome && meta.title && !hasH1) {
              let headerBlock = '# ' + meta.title + '\n\n';
              if (meta.description) {
                headerBlock += '<p class="ad-page-lead">' + meta.description + '</p>\n\n';
              }
              content = headerBlock + content;
            }

            // 4. Convert :::tip[Title] ... ::: / :::note / :::caution / :::danger callouts into Branded Callout HTML
            content = content.replace(
              /:::(tip|note|caution|danger)(?:\[([^\]]*)\])?\r?\n([\s\S]*?)\r?\n:::/g,
              function (_, type, customTitle, body) {
                const defaultTitles = {
                  tip: 'Tip',
                  note: 'Note',
                  caution: 'Important',
                  danger: 'Warning'
                };
                const title = customTitle || defaultTitles[type] || 'Note';
                return (
                  '\n<div class="ad-callout ad-callout--' + type + '">\n' +
                  '  <div class="ad-callout-title">' + title + '</div>\n' +
                  '  <div class="ad-callout-body">\n\n' + body.trim() + '\n\n  </div>\n' +
                  '</div>\n'
                );
              }
            );

            // 5. Normalize internal links & Pages CMS media paths so they never 404 in Docsify
            content = content.replace(/\]\(\/(presenter|admin-centre)\/([a-z0-9-]+)\/\)/gi, '](/$1/$2)');
            content = content.replace(/\]\(\/support\/\)/gi, '](/support)');
            if (vm.route && vm.route.path && /^\/(presenter|admin-centre)\//i.test(vm.route.path)) {
              content = content.replace(/!\[([^\]]*)\]\(\/?media\/([^)]+)\)/g, '![$1](../media/$2)');
            }

            return content;
          });

          hook.doneEach(function () {
            setMobileSidebarOpen(false);
            setTimeout(function () {
              enhanceSidebar(vm.route.path);
              wrapResponsiveTables();
              hydratePresenterDownloads();
            }, 0);
          });
        }
      ]
    };

    function setMobileSidebarOpen(isOpen) {
      document.body.classList.toggle('ad-sidebar-open', Boolean(isOpen));
      const toggleBtn = document.getElementById('adMobileToggle');
      if (toggleBtn) {
        toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      }
    }

    // Wrap wide markdown tables in a smooth horizontal scroll container for mobile screens
    function wrapResponsiveTables() {
      const container = document.querySelector('.markdown-section');
      if (!container) return;
      container.querySelectorAll('table').forEach(function (tbl) {
        if (tbl.parentElement && tbl.parentElement.classList.contains('ad-table-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 'ad-table-wrap';
        tbl.parentNode.insertBefore(wrap, tbl);
        wrap.appendChild(tbl);
      });
    }

    // Dynamically populate latest GitHub Release download URLs on the Presenter overview page (matches alongsidedigital.co.uk/products/presenter/download)
    let cachedPresenterRelease = null;
    async function hydratePresenterDownloads() {
      const container = document.getElementById('adPresenterDownloads');
      if (!container) return;
      try {
        if (!cachedPresenterRelease) {
          const res = await fetch('https://api.github.com/repos/AlongsideDigitalCIC/presenter/releases/latest');
          if (!res.ok) return;
          cachedPresenterRelease = await res.json();
        }
        const assets = cachedPresenterRelease && Array.isArray(cachedPresenterRelease.assets) ? cachedPresenterRelease.assets : [];
        container.querySelectorAll('a[data-ext]').forEach(function (link) {
          const ext = link.getAttribute('data-ext');
          const arch = link.getAttribute('data-arch') || '';
          const match = assets.find(function (a) {
            if (!a.name || !a.name.endsWith(ext)) return false;
            if (arch === 'aarch64') return a.name.includes('aarch64') || a.name.includes('arm64');
            if (arch === 'x64') return a.name.includes('x64') || a.name.includes('amd64') || a.name.includes('x86_64');
            return true;
          }) || assets.find(function (a) { return a.name && a.name.endsWith(ext); });
          if (match && match.browser_download_url) {
            link.href = match.browser_download_url;
          }
        });
      } catch (e) {
        // Fallback links to alongsidedigital.co.uk/products/presenter/download remain active
      }
    }

    // Mobile drawer toggle & Global Multi-Sidebar Search Index
    document.addEventListener('DOMContentLoaded', function () {
      const toggleBtn = document.getElementById('adMobileToggle');
      const backdrop = document.getElementById('adSidebarBackdrop');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          setMobileSidebarOpen(!document.body.classList.contains('ad-sidebar-open'));
        });
      }
      if (backdrop) {
        backdrop.addEventListener('click', function () {
          setMobileSidebarOpen(false);
        });
      }
      document.addEventListener('click', function (e) {
        if (document.body.classList.contains('ad-sidebar-open') && e.target.closest('.sidebar a[href]')) {
          setMobileSidebarOpen(false);
        }
      });
      window.addEventListener('resize', function () {
        if (window.innerWidth >= 960 && document.body.classList.contains('ad-sidebar-open')) {
          setMobileSidebarOpen(false);
        }
      });

      const searchInput = document.getElementById('adSearchInput');
      const searchResults = document.getElementById('adSearchResults');
      const searchBox = document.getElementById('adSearchBox');
      const pagesIndex = [];

      async function buildSearchIndex() {
        const sidebarFiles = ['_sidebar.md?v=10'];
        const routes = [];
        const linkRegex = /\[([^\]]+)\]\(([^)]+)\)/g;

        await Promise.all(
          sidebarFiles.map(async function (sbFile) {
            try {
              const sbRes = await fetch(docsBasePath + sbFile);
              if (!sbRes.ok) return;
              const sbText = await sbRes.text();
              let m;
              while ((m = linkRegex.exec(sbText)) !== null) {
                const label = m[1].trim();
                const route = m[2].trim();
                if (!routes.some(function (r) { return r.route === route; })) {
                  routes.push({ label: label, route: route });
                }
              }
            } catch (e) {
              // skip missing sidebar
            }
          })
        );

        await Promise.all(
          routes.map(async function (item) {
            const cleanRoute = item.route === '/'
              ? 'README.md'
              : item.route.endsWith('/')
              ? item.route.replace(/^\//, '') + 'README.md'
              : item.route.replace(/^\//, '').replace(/\.md$/, '') + '.md';
            try {
              const res = await fetch(docsBasePath + cleanRoute);
              if (!res.ok) return;
              const raw = (await res.text()).replace(/^\uFEFF/, '');
              let title = item.label;
              const fm = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (fm) {
                const tm = fm[1].match(/title:\s*(.+)/i);
                if (tm) title = tm[1].trim().replace(/^['"]|['"]$/g, '');
              }
              const plain = raw
                .replace(/^---\r?\n[\s\S]*?\r?\n---/, '')
                .replace(/<[^>]+>/g, ' ')
                .replace(/:::(tip|note|caution|danger)(\[[^\]]*\])?/g, ' ')
                .replace(/:::/g, ' ')
                .replace(/[#*`>|_-]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

              const category = item.route.indexOf('/presenter') === 0
                ? 'Presenter'
                : item.route.indexOf('/admin-centre') === 0
                ? 'Admin Centre'
                : 'Help Centre';

              pagesIndex.push({
                title: title,
                route: '#' + (item.route.startsWith('/') ? item.route : '/' + item.route),
                category: category,
                text: plain
              });
            } catch (e) {
              // ignore individual fetch errors
            }
          })
        );
      }

      buildSearchIndex();

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderResults(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
          searchResults.classList.remove('open');
          searchResults.innerHTML = '';
          return;
        }

        const terms = q.split(/\s+/).filter(Boolean);
        const matches = pagesIndex
          .map(function (page) {
            const titleLow = page.title.toLowerCase();
            const textLow = page.text.toLowerCase();
            let score = 0;
            terms.forEach(function (t) {
              if (titleLow.includes(t)) score += 10;
              if (textLow.includes(t)) score += 3;
            });
            return { page: page, score: score };
          })
          .filter(function (item) { return item.score > 0; })
          .sort(function (a, b) { return b.score - a.score; })
          .slice(0, 8);

        if (matches.length === 0) {
          searchResults.innerHTML = '<div class="ad-search-empty">No matching guides found. Need help? Email <strong>help@alongsidedigital.co.uk</strong></div>';
          searchResults.classList.add('open');
          return;
        }

        const firstTerm = terms[0];
        const html = matches
          .map(function (m) {
            const p = m.page;
            const idx = p.text.toLowerCase().indexOf(firstTerm);
            let start = idx > 45 ? idx - 45 : 0;
            let snippet = p.text.slice(start, start + 145);
            if (start > 0) snippet = '...' + snippet;
            if (start + 145 < p.text.length) snippet = snippet + '...';

            let safeSnippet = escapeHtml(snippet);
            terms.forEach(function (t) {
              if (t.length > 1) {
                const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                safeSnippet = safeSnippet.replace(re, '<mark>$1</mark>');
              }
            });

            return (
              '<a class="ad-search-item" href="' + p.route + '">' +
              '  <div class="ad-search-item-top">' +
              '    <span class="ad-search-item-title">' + escapeHtml(p.title) + '</span>' +
              '    <span class="ad-search-item-badge">' + escapeHtml(p.category) + '</span>' +
              '  </div>' +
              '  <p class="ad-search-item-snippet">' + safeSnippet + '</p>' +
              '</a>'
            );
          })
          .join('');

        searchResults.innerHTML = html;
        searchResults.classList.add('open');
      }

      searchInput.addEventListener('input', function (e) {
        renderResults(e.target.value);
      });

      searchInput.addEventListener('focus', function (e) {
        if (e.target.value.trim()) renderResults(e.target.value);
      });

      searchResults.addEventListener('click', function (e) {
        if (e.target.closest('.ad-search-item')) {
          searchResults.classList.remove('open');
        }
      });

      document.addEventListener('click', function (e) {
        if (!searchBox.contains(e.target)) {
          searchResults.classList.remove('open');
        }
      });

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === 'Escape') {
          searchResults.classList.remove('open');
          searchInput.blur();
          setMobileSidebarOpen(false);
        }
      });
    });
  </script>
