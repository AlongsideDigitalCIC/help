[build]
  publish = "."

[[redirects]]
  from = "/presenter/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin-centre/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/support*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
